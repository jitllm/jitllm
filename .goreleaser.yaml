# Release configuration. `.github/workflows/release.yml` runs it on a v* tag;
# locally, `goreleaser release --snapshot --clean` builds everything into dist/
# without publishing.
version: 2

project_name: jitllm

git:
  # Only v* tags are releases. safety/detached-2026-09-13 is a bookmark, and
  # without this it could be taken as the previous release when the changelog
  # looks for one. Named in full: these entries are exact tag names.
  ignore_tags:
    - safety/detached-2026-09-13

builds:
  # The engine's CLI, from the root module.
  - id: jitllm
    main: ./cmd/jitllm
    binary: jitllm
    env:
      # There is no cgo anywhere: CUDA, Vulkan and Metal are opened at run time
      # through goffi (jit_old/gpu/ffi), and every kernel is generated in process. So one Linux
      # runner cross-builds every target.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  # The daemon: its own module (server/go.mod) so the engine keeps one
  # dependency; `dir` builds it from there.
  - id: jitllmd
    dir: server
    main: ./cmd/jitllmd
    binary: jitllmd
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  # The desktop app (ui/go.mod), one build per way it is packaged
  # (ui/cmd/pack). On Linux it is the binary.
  - id: jitllm-desktop
    dir: ui
    main: .
    binary: jitllm-desktop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux]
    goarch: [amd64, arm64]

  # On Windows it is linked as a GUI program, so starting it opens no console
  # window beside it, with the icon and version information from the resource
  # object written beside it first; the check refuses a console program.
  - id: jitllm-desktop-windows
    dir: ui
    main: .
    binary: jitllm-desktop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [windows]
    goarch: [amd64, arm64]
    hooks:
      pre:
        - cmd: go run ./cmd/pack syso -arch {{ .Arch }} -version {{ .Version }}
          dir: ui
      post:
        - cmd: go run ./cmd/pack check {{ abs .Path }}
          dir: ui

  # On macOS it is also wrapped in jitllm.app, which the archive carries beside
  # the bare binary: Info.plist, the icon, the binary under Contents/MacOS.
  - id: jitllm-desktop-darwin
    dir: ui
    main: .
    binary: jitllm-desktop
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [darwin]
    goarch: [amd64, arm64]
    hooks:
      post:
        - cmd: go run ./cmd/pack app -bin {{ abs .Path }} -version {{ .Version }} -o dist-app/{{ .Os }}_{{ .Arch }}/jitllm.app
          dir: ui

  # The terminal app (tui/go.mod).
  - id: jitllm-tui
    dir: tui
    main: .
    binary: jitllm-tui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: jitllm
    ids: [jitllm]
    name_template: "jitllm_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: &docs
      - README.md
      - LICENSE
      - COPYRIGHT
  - id: jitllmd
    ids: [jitllmd]
    name_template: "jitllmd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: *docs
  - id: jitllm-desktop
    ids: [jitllm-desktop, jitllm-desktop-windows]
    name_template: "jitllm-desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: *docs
  - id: jitllm-desktop-darwin
    ids: [jitllm-desktop-darwin]
    name_template: "jitllm-desktop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - COPYRIGHT
      # goreleaser drops the matched files' common directory, which is
      # Contents (Info.plist sits in it), so dst puts it back under the bundle.
      - src: "ui/dist-app/{{ .Os }}_{{ .Arch }}/jitllm.app/**/*"
        dst: jitllm.app/Contents
  - id: jitllm-tui
    ids: [jitllm-tui]
    name_template: "jitllm-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: *docs

# The container image: jitllmd serving, with the jitllm CLI beside it, for
# linux/amd64 and linux/arm64 under one multi-platform tag (dockers_v2 builds
# the manifest list itself; there is no separate docker_manifests step). The
# root Dockerfile with BIN=dist copies the binaries built above from the
# context, so the image carries what the archives carry. A release pushes the
# version tag here; the workflow's publish job moves `latest` to it only after
# the shipped archives pass their smoke runs. A snapshot builds and loads one
# image per platform and pushes nothing (`--skip=docker` leaves them out).
dockers_v2:
  - id: jitllm
    ids: [jitllm, jitllmd]
    dockerfile: Dockerfile
    images: ["ghcr.io/jitllm/jitllm"]
    tags: ["{{ .Version }}"]
    platforms: [linux/amd64, linux/arm64]
    build_args:
      BIN: dist
    labels:
      org.opencontainers.image.title: jitllm
      org.opencontainers.image.description: "jitllmd, the jitllm inference daemon, with the jitllm CLI"
      org.opencontainers.image.source: https://github.com/jitllm/jitllm
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# macOS signing.
#
# With no secrets set this block is disabled and the darwin binaries keep the
# ad-hoc signature Go's linker gives every darwin/arm64 binary. That signature
# carries no hardened runtime, and jit_old/cpu/exec_darwin.go measures that such a
# binary runs generated code with no codesign step at all. The release
# workflow's smoke job runs the shipped darwin archive on a macOS runner to
# prove it for each release.
#
# With a Developer ID certificate and an App Store Connect API key in the
# secrets, the binaries are signed with the hardened runtime and the JIT
# entitlements, then notarized. This runs on Linux (goreleaser uses quill).
# quill signs only with an Apple-issued chain, so a self-signed certificate
# (no notary key beside it) leaves the bare binaries ad-hoc signed; the
# desktop app is still signed with it on the Mac.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids: [jitllm, jitllmd, jitllm-desktop-darwin, jitllm-tui]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        entitlements: ./.github/release/entitlements.plist
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "
  groups:
    - title: Documentation and measurements
      regexp: '^(docs|website)[:(]'
      order: 1
    - title: Changes
      order: 0

release:
  github:
    owner: jitllm
    name: jitllm
  # The workflow publishes the draft only after the shipped CLI archives have
  # run on Linux amd64, Linux arm64 and macOS arm64, and every archive of those
  # targets has passed its checksum and unpacked.
  draft: true
  replace_existing_draft: true
  prerelease: auto

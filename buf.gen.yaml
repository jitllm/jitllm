version: v2

# Regenerate with `buf generate` from the repository root. `clean` makes the
# output a function of the .proto files alone: a message deleted from a .proto
# cannot survive in server/gen as a stale Go type.
clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/jitllm/jitllm/server/gen

plugins:
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: server/gen
    opt: paths=source_relative
  # The browser client (server/webui). protoc-gen-es is a devDependency of
  # that package; `npm ci` in server/webui puts it where this path points.
  - local: server/webui/node_modules/.bin/protoc-gen-es
    out: server/webui/src/gen
    opt: target=ts

syntax = "proto3";

package jitllm.v1;

import "jitllm/v1/common.proto";
import "jitllm/v1/model.proto";

// InferenceService is the generate path. Both compatibility shims -- the
// OpenAI one and the Anthropic one -- are thin adapters over THIS, not
// parallel implementations of it.

service InferenceService {
  // The streaming path. A generate is a sequence of events rather than a
  // sequence of strings, because a caller needs to know it was QUEUED behind
  // another session on the same device, and a bare token stream cannot say so.
  rpc Generate(GenerateRequest) returns (stream GenerateResponse) {}

  // The same path, accumulated. It exists so a non-streaming client is not
  // forced to consume a stream; it is the streaming path with the events
  // collected, not a second implementation.
  rpc Complete(GenerateRequest) returns (CompleteResponse) {}

  // Stop a generation that is in flight on a session. Closing the stream does
  // this too; this exists for a client that holds the stream somewhere else.
  rpc Cancel(CancelRequest) returns (CancelResponse) {}

  // One vector per input from an embedding model's pooled readout: the
  // container's own pooling, its projection heads, then an L2 normalisation.
  // The vectors are the ones `jitllm embed` prints for the same model and
  // text. A model whose container states no pooling is refused: its last
  // residual has no readout the weights were trained for.
  rpc Embed(EmbedRequest) returns (EmbedResponse) {}
}

// PromptInput is the one prompt representation. Text and token ids are the two
// honest forms; chat is a third because rendering the template is the engine's
// job and a caller that renders it itself will get the special tokens wrong.
message PromptInput {
  oneof input {
    string text = 1;
    TokenIDs token_ids = 2;
    ChatPrompt chat = 3;
  }
}

message TokenIDs {
  repeated int32 ids = 1;
}

message ChatPrompt {
  repeated ChatMessage messages = 1;
  // A system message. Carried separately because one of the two compat APIs
  // puts it in a top-level field and the other puts it in the message list,
  // and flattening it here loses which one the caller meant.
  optional string system = 2;
  bool add_generation_prompt = 3;
  string template_name = 4;

  // Functions the model may call, handed to its chat template as the OpenAI
  // API's `tools`. Withheld when `tool_choice` is NONE.
  repeated Tool tools = 5;
  ToolChoice tool_choice = 6;
}

// Tool is one function the model may call: the OpenAI API's
// {"type": "function", "function": {name, description, parameters, strict}}.
message Tool {
  string name = 1;
  string description = 2;
  // The parameters as a JSON Schema document, text, its key order kept.
  string parameters_json = 3;
  // Passed to the template as the API's `strict`.
  optional bool strict = 4;
}

enum ToolChoiceMode {
  TOOL_CHOICE_MODE_UNSPECIFIED = 0;
  // No calls; the tools are withheld from the template.
  TOOL_CHOICE_MODE_NONE = 1;
  TOOL_CHOICE_MODE_AUTO = 2;
  // At least one call to a declared tool, held to the model's own tool-call
  // syntax by a grammar.
  TOOL_CHOICE_MODE_REQUIRED = 3;
  // A call to the tool `name`.
  TOOL_CHOICE_MODE_FUNCTION = 4;
}

message ToolChoice {
  ToolChoiceMode mode = 1;
  // The tool a FUNCTION choice names; it must be one of `tools`.
  string name = 2;
  // At most one call in the reply (the API's parallel_tool_calls false).
  bool single_call = 3;
}

// ResponseFormat is the OpenAI API's response_format. It is turned into a
// grammar by the code the HTTP surface runs, so a schema either surface
// builds the other builds, and one it refuses the other refuses in the same
// words.
message ResponseFormat {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    // No constraint.
    TYPE_TEXT = 1;
    // Any JSON object.
    TYPE_JSON_OBJECT = 2;
    // A sentence of `json_schema`.
    TYPE_JSON_SCHEMA = 3;
  }
  Type type = 1;
  // The schema document, for TYPE_JSON_SCHEMA.
  string json_schema = 2;
  string name = 3;
  // Accepted for compatibility: the grammar always holds the reply to the
  // schema, so there is no non-strict mode to select.
  optional bool strict = 4;
}

message GenerateRequest {
  // Generate against an existing session, keeping its KV cache and position.
  // Mutually exclusive with `model_id`.
  string session_id = 1;
  // Generate against a model in an EPHEMERAL session created for this call
  // and closed when it ends.
  string model_id = 2;

  PromptInput prompt = 3;
  // The most tokens to generate. 0 runs until the model ends its reply or
  // fills the session's context; a larger value than the context has room
  // for is cut to that room. A reply that reaches the end of the context
  // finishes with FINISH_REASON_MAX_TOKENS.
  int32 max_tokens = 4;
  SamplingParams sampling = 5;
  repeated string stop = 6;

  // Continue from the session's existing position instead of prefilling from
  // scratch. False re-prefills, which is what a stateless client wants.
  bool continue_session = 7;

  // Emit the prompt's tokens back before generation starts. Off by default:
  // echoing the prompt is what makes a completion read as one continuous
  // text, and a chat turn is not one.
  bool echo_prompt = 8;

  // Maximum milliseconds to wait for a row of the model's step loop when it is
  // full. Zero waits indefinitely. A request is never refused, but a caller
  // may decline to wait.
  int32 queue_timeout_millis = 9;

  // Keep generating past an end-of-generation token, up to max_tokens: the
  // token is sampled, emitted and fed like any other, as vLLM's `ignore_eos`
  // does (llama-server's bans the token from sampling instead). Stop strings
  // still end the generate. For a run whose length must be fixed, such as a
  // benchmark.
  bool ignore_eos = 10;

  // Speculative decoding for this generate; unset takes the session's.
  SpeculationParams speculation = 30;

  // Structured output: the reply is a sentence of this GBNF grammar
  // (llama.cpp's format, root rule `root`), and ends where it does. A
  // constrained generate runs alone and without speculation.
  string grammar = 31;
  // Structured output by JSON Schema, compiled to a grammar: the subset
  // llama.cpp's json-schema-to-grammar builds, anything else refused by
  // name. Not with `grammar`.
  string json_schema = 32;

  // The OpenAI API's response_format. Not with `grammar` or `json_schema`, and
  // not with a forced tool call: each is one constraint.
  ResponseFormat response_format = 33;

  // The number of continuations of one prompt (the API's `n`), 0 or 1 for one.
  // The prompt is prefilled once; choice i samples with seed + i of
  // `sampling.seed` (a random base when unset). Events carry their `choice`.
  int32 n = 34;

  // Per-token log-probabilities of the model's raw distribution, before
  // temperature, penalties and top-k/top-p/min-p, with the `top_logprobs`
  // (0 to 20) most likely alternatives at each step. top_logprobs needs
  // logprobs; neither is accepted with `echo_prompt`.
  bool logprobs = 35;
  optional int32 top_logprobs = 36;

  // Send a GenerateUsage event once every choice has finished: the API's
  // stream_options.include_usage. Complete always reports usage.
  bool include_usage = 37;

  // The request's claim on the host budget: "high" or "normal"; empty leaves
  // it as it is (the OpenAI surface's jitllm_priority).
  string priority = 38;
}

// GenerateResponse is one event. The oneof is deliberate: a token stream that
// cannot report "you waited 4 s for a device" hides the one property of this
// engine a caller most needs to see.
message GenerateResponse {
  oneof event {
    GenerateStarted started = 1;
    GenerateToken token = 2;
    GenerateFinished finished = 3;
    // Tool calls the reply made, each sent as soon as its markup closes.
    GenerateToolCalls tool_calls = 4;
    // Sent once, last, when the request set include_usage.
    GenerateUsage usage = 5;
  }
  // The continuation an event belongs to, 0 unless the request set n above 1.
  int32 choice = 6;
}

message GenerateToolCalls {
  repeated ToolCall calls = 1;
  // The position of the first of `calls` among the choice's calls.
  int32 first_index = 2;
}

// Usage is the OpenAI API's usage object. The prompt is counted once for the
// request: every choice after the first restored it rather than ran it.
message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
  // Prompt tokens restored from the memory cache or a prompt store.
  int32 cached_tokens = 4;
}

message GenerateUsage {
  Usage usage = 1;
}

// TokenLogprob is a sampled token's log-probability and the most likely
// alternatives at its step, most likely first.
message TokenLogprob {
  int32 token_id = 1;
  // The token alone, decoded on its own: its bytes, which may be part of a rune.
  string token = 2;
  float logprob = 3;
  repeated TopLogprob top = 4;
}

message TopLogprob {
  int32 token_id = 1;
  string token = 2;
  float logprob = 3;
}

message GenerateStarted {
  string session_id = 1;
  string model_id = 2;
  // True when the session was created for this call and will be closed after.
  bool ephemeral_session = 3;

  int32 prompt_tokens = 4;
  // Milliseconds this request waited before it ran: when `batched`, for
  // admission into the model's step loop. Zero otherwise: nothing waits for a
  // device or the host as a whole.
  int64 queued_millis = 5;
  // Requests ahead of this one in that queue when it arrived.
  int32 queue_depth_on_entry = 6;

  // Where the blocks ran. A caller comparing two rates needs this, and the
  // engine's own rule is that a backend is quoted with every number.
  int32 device_blocks = 7;
  int32 cpu_blocks = 8;
  repeated string device_ids = 9;

  // Prefill wall time. When `batched`, the prompt went in chunks inside steps
  // shared with requests decoding, and this spans all of them.
  int64 prefill_millis = 10;

  // True when this request decodes as a row of its model's step loop, sharing
  // each decode step with the model's other live requests (ModelStats.batch).
  // False when it runs alone on its gates: a host-only model, a session not
  // wholly on one device, or batching turned off.
  bool batched = 11;
}

message GenerateToken {
  int32 token_id = 1;
  // The incremental text this token contributed. Empty when the token is a
  // partial UTF-8 sequence whose bytes are held back until it completes.
  string text = 2;
  int32 index = 3;
  // Set when the request asked for logprobs.
  TokenLogprob logprob = 4;
}

message GenerateFinished {
  FinishReason reason = 1;
  // The stop string that matched, when `reason` is STOP.
  string stop_matched = 2;

  int32 prompt_tokens = 3;
  int32 completion_tokens = 4;

  int64 prefill_millis = 5;
  int64 decode_millis = 6;

  // Reported as a rate AND as the bytes behind it, because a rate alone is
  // unfalsifiable. `bytes_per_token` is what the pager actually moved.
  double decode_tokens_per_second = 7;
  uint64 bytes_per_token = 8;

  // The session's position after this generation, so a caller continuing a
  // conversation knows where it is without a second call.
  int32 position = 9;

  // Prompt tokens restored from the memory cache or a prompt store rather
  // than computed: the API's prompt_tokens_details.cached_tokens.
  int32 cached_tokens = 10;
}

// CompleteResponse is the accumulated generate. `started`, `text`,
// `token_ids` and `finished` are the first choice's, as they were before
// requests could ask for several; `choices` holds every choice, the first
// again, and is where a reader of tool calls and logprobs looks.
message CompleteResponse {
  GenerateStarted started = 1;
  // The reply's text. When the request declared tools and the reply made
  // calls, the text without the calls' markup.
  string text = 2;
  repeated int32 token_ids = 3;
  GenerateFinished finished = 4;
  repeated CompleteChoice choices = 5;
  Usage usage = 6;
}

message CompleteChoice {
  int32 index = 1;
  GenerateStarted started = 2;
  string text = 3;
  repeated int32 token_ids = 4;
  repeated ToolCall tool_calls = 5;
  // One per generated token, when the request asked for logprobs.
  repeated TokenLogprob logprobs = 6;
  // Its reason is TOOL_CALLS when the reply made calls.
  GenerateFinished finished = 7;
}

message CancelRequest {
  string session_id = 1;
}

message CancelResponse {
  bool was_generating = 1;
}

// EmbedInput is one text to embed. Text is tokenized as `jitllm embed`
// tokenizes it -- the specials the model's tokenizer adds, and for a
// last-token pooled decoder the EOS it pools at. Token ids are taken verbatim:
// a caller sending ids owns those specials.
message EmbedInput {
  oneof input {
    string text = 1;
    TokenIDs token_ids = 2;
  }
}

// EmbedRequest carries no pooling, normalisation or truncation switch, as the
// CLI carries none: the container says how the vector is read out, a vector
// read out any other way is one the weights were never trained to produce,
// and a silently truncated input is an embedding of a different text. An
// input longer than the model takes is refused with the limit named.
message EmbedRequest {
  // A loaded model's id, or the file name it was loaded from.
  string model_id = 1;
  // Embedded in order, through one embedder, in one turn on the host.
  repeated EmbedInput inputs = 2;
  // The vector width wanted. Zero, or the model's own width, is the model's
  // vector. Any other width is refused: a shorter prefix is an embedding only
  // for a model trained for Matryoshka truncation, and the container records
  // no such property.
  int32 dimensions = 3;
  // Ignored: an embed waits for nothing as a whole, it takes the host's
  // shared pool a region at a time beside every other session.
  int32 queue_timeout_millis = 4;
}

message Embedding {
  // L2-normalised.
  repeated float vector = 1;
  // The tokens this input ran as, specials included.
  int32 tokens = 2;
}

message EmbedResponse {
  string model_id = 1;
  // One per input, in input order.
  repeated Embedding embeddings = 2;
  int32 dimensions = 3;
  // The container's readout: "mean", "cls" or "last".
  string pooling = 4;
  int32 total_tokens = 5;
  // Zero: kept for a reader of older servers, which held the host per request.
  int64 queued_millis = 6;
  int32 queue_depth_on_entry = 7;
  // Wall time of the embedding itself, every input.
  int64 embed_millis = 8;
}
